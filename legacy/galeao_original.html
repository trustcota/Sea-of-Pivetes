<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galeão pirata no oceano</title>
<style>
:root{--bg:#0b1d2a;--panel:rgba(255,255,255,.8);--ink:#10222f;--mut:#566a78;--acc:#0e7c9a;--on:#fff;--line:rgba(16,34,47,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(11,24,34,.74);--ink:#e8f1f6;--mut:#9db3c1;--acc:#5fd0e8;--on:#06202b;--line:rgba(232,241,246,.16)}}
:root[data-theme="dark"]{--panel:rgba(11,24,34,.74);--ink:#e8f1f6;--mut:#9db3c1;--acc:#5fd0e8;--on:#06202b;--line:rgba(232,241,246,.16)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#ui{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:min(300px,calc(100% - 24px));box-sizing:border-box;padding:12px 14px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
h1{margin:0 0 2px;font-size:15px}
#st{margin:0 0 10px;color:var(--mut);font-size:12px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button{font:inherit;font-size:13px;padding:8px 4px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button.on{background:var(--acc);color:var(--on);border-color:transparent;font-weight:600}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:12px}
input{width:100%;accent-color:var(--acc);margin:0}
#hint{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;color:#fff;opacity:.75;text-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none}
.two{grid-template-columns:repeat(2,1fr);margin-top:12px}
#ui{max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow-y:auto}
.sr{display:grid;grid-template-columns:76px 1fr 36px;align-items:center;gap:6px;margin:6px 0}.sr span{font-size:12px;color:var(--mut)}.sr b{font-size:11px;text-align:right;font-weight:600}
#mn{position:absolute;top:8px;right:8px;width:30px;height:28px;padding:0;font-size:16px;line-height:1}
#ui h1{padding-right:34px}#ui.min{width:auto;padding:8px 46px 8px 14px}#ui.min>*:not(h1):not(#mn){display:none}#ui.min h1{margin:0;padding:0}
#pr,#gg{position:fixed;left:50%;transform:translateX(-50%);display:none;box-sizing:border-box;padding:8px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);text-align:center;pointer-events:none}
#pr{bottom:calc(64px + env(safe-area-inset-bottom,0px));font-size:13px}#pr.on{display:block}
#gg{bottom:calc(52px + env(safe-area-inset-bottom,0px));width:min(340px,80%)}#gg.on{display:block}
#gl{font-size:12px;color:var(--mut);margin-bottom:6px}#gv{font-size:12px;margin-top:6px;font-weight:600}
.bar{position:relative;height:10px;border-radius:6px;background:var(--line)}.bar i{position:absolute;top:0;bottom:0;background:var(--acc);border-radius:6px}
.bar s{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink);display:none}#gg.r .bar s{display:block}#gg.lim .bar{outline:2px solid #e5534b}
#gb{position:fixed;right:16px;bottom:calc(100px + env(safe-area-inset-bottom,0px));display:none;padding:16px 14px;border-radius:50%;touch-action:none;background:var(--acc);color:var(--on);font-weight:600}#gb.on{display:block}
#gq{position:fixed;right:16px;bottom:calc(168px + env(safe-area-inset-bottom,0px));display:none;padding:16px 14px;border-radius:50%;touch-action:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:600}#gq.on{display:block}
#gj{position:fixed;right:84px;bottom:calc(100px + env(safe-area-inset-bottom,0px));display:none;padding:16px 12px;border-radius:50%;touch-action:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:600}#gj.on{display:block}
@media (hover:hover) and (pointer:fine){#gb,#gq,#gj{display:none!important}}
#wh{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:116px;box-sizing:border-box;padding:8px 6px;border-radius:14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:center;font-size:10.5px;line-height:1.35;color:var(--ink);pointer-events:none}
#wh svg{display:block;margin:0 auto 4px;color:var(--ink)}
@media (max-width:520px){#ui{width:calc(100% - 24px - 112px)}}
</style>
</head>
<body>
<div id="ui">
<h1>Galeão pirata no oceano</h1>
<button id="mn" title="Minimizar painel">–</button>
<p id="st">Mar calmo</p>
<div class="row"><button data-s="0.04">Calmo</button><button data-s="0.5">Ondas</button><button data-s="1">Tempestade</button></div>
<label for="sl">Intensidade</label>
<input id="sl" type="range" min="0" max="100" value="4">
<label for="wsl">Força do vento</label>
<input id="wsl" type="range" min="0" max="100" value="15">
<label for="wdr">Direção do vento (sopra para <span id="wdv">26°</span>)</label>
<input id="wdr" type="range" min="0" max="359" value="26">
<div class="row" style="margin-top:6px"><button id="w0">Popa</button><button id="w1">Través</button><button id="w2">Bolina</button></div>
<label for="hlm">Leme (← bombordo · estibordo →)</label>
<input id="hlm" type="range" min="-100" max="100" value="0">
<div class="row" style="grid-template-columns:1fr;margin-top:12px"><button id="fv">Entrar no navio (FPV)</button></div>
<div class="row" style="grid-template-columns:1fr;margin-top:8px"><button id="tm">Modo teste (liberar painel)</button></div>
<div class="row" style="grid-template-columns:1fr;margin-top:8px"><button id="an">Âncora: içada (lançar)</button></div>
<div class="row two"><button id="ar" class="on">Girar sozinho</button><button id="wf">Malha do navio</button></div>
<label>Velas</label>
<div class="row"><button id="up">Içar tudo</button><button id="md">Meia vela</button><button id="dn">Arriar</button></div>
<label>Içar (cordas douradas)</label>
<div id="sls"></div>
<label>Rotacionar (cordas vermelhas)</label>
<div id="rts"></div>
<div class="row" style="grid-template-columns:1fr;margin-top:8px"><button id="ct">Centralizar velas</button></div>
<label>Mapa · distância de renderização <b id="mapa-rgv">0 m</b></label>
<input id="mapa-rg" type="range" min="2" max="20" step="1" value="2">
<div class="row"><button data-vd="2" class="on">Curta</button><button data-vd="3">Média</button><button data-vd="4">Longa</button></div>
<div class="row two" style="margin-top:6px"><button id="mapa-au" class="on">Auto</button><button id="mapa-ns">Nova semente</button></div>
<label for="mapa-gh">Altura das ilhas <b id="mapa-ghv"></b></label>
<input id="mapa-gh" type="range" min="2" max="12" step=".2" value="4.6">
<label for="mapa-gd">Profundidade do oceano <b id="mapa-gdv"></b></label>
<input id="mapa-gd" type="range" min="3" max="20" step="1" value="9">
<label for="mapa-gs">Distância entre ilhas <b id="mapa-gsv"></b></label>
<input id="mapa-gs" type="range" min="120" max="300" step="5" value="140">
<label for="mapa-gn">Densidade de ilhas <b id="mapa-gnv"></b></label>
<input id="mapa-gn" type="range" min="40" max="100" step="5" value="85">
</div>
<div id="wh"><svg viewBox="0 0 100 100" width="88" height="88"><circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-opacity=".28" stroke-width="2"/><path d="M50 26 L62 68 L50 61 L38 68 Z" fill="currentColor" fill-opacity=".8"/><g id="wha" transform="translate(50 50)"><line x1="0" y1="42" x2="0" y2="-4" style="stroke:var(--acc)" stroke-width="4" stroke-linecap="round"/><polygon points="0,-20 -9,-4 9,-4" style="fill:var(--acc)"/></g></svg><div id="wht"></div></div>
<div id="pr"></div>
<div id="gg"><div id="gl"></div><div class="bar"><i id="gf"></i><s></s></div><div id="gv"></div></div>
<button id="gb">Pegar</button>
<button id="gq">Olhar</button>
<button id="gj">Pular</button>
<div id="hint">Arraste para girar · role para aproximar</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const m3=(a,s)=>s<.5?a[0]+(a[1]-a[0])*s*2:a[1]+(a[2]-a[1])*(s-.5)*2;
const c3=(a,s,o)=>s<.5?o.copy(a[0]).lerp(a[1],s*2):o.copy(a[1]).lerp(a[2],s*2-1);
const K=h=>h.map(x=>new T.Color(x));
const SKY=K([0x8fd3f4,0x9fb0bb,0x232b35]),DEEP=K([0x1b86b0,0x14566f,0x0a2433]),SHAL=K([0x5ad6d2,0x3c93a0,0x28606e]),CLD=K([0xffffff,0xb3bcc4,0x39424d]);
const FOAM=new T.Color(0xf2fbff),WH=new T.Color(0xffffff),cD=new T.Color(),cS=new T.Color(),q=new T.Color();

// Cena, luzes, névoa
const R=new T.WebGLRenderer({antialias:true}),sc=new T.Scene(),cam=new T.PerspectiveCamera(60,1,.5,800);
R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(R.domElement);
const sky=new T.Color(),sunL=new T.DirectionalLight(0xfff0d0,1),hemi=new T.HemisphereLight(0xffffff,0x1b5a78,.6),fLight=new T.DirectionalLight(0xcfe0ff,0);
sunL.position.set(-70,35,-50);fLight.position.set(20,60,30);
sc.background=sky;sc.fog=new T.FogExp2(0xffffff,.014);sc.add(sunL,hemi,fLight);

// Oceano: malha jitterizada, triângulos não indexados (cor chapada por face)
const N=90,SZ=240,cl=SZ/N,bx=[],bz=[],ix=[];
for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){bx.push((i/N-.5)*SZ);bz.push((j/N-.5)*SZ)}
for(let j=0;j<N;j++)for(let i=0;i<N;i++){const a=j*(N+1)+i,b=a+1,c=a+N+1,d=c+1;ix.push(a,c,b,b,c,d)}
const NV=bx.length,P=new Float32Array(NV*3),pos=new Float32Array(ix.length*3),col=new Float32Array(ix.length*3),jit=[];
for(let f=0;f<ix.length/3;f++)jit.push(rnd(.93,1.06));
const og=new T.BufferGeometry();og.setAttribute('position',new T.BufferAttribute(pos,3));og.setAttribute('color',new T.BufferAttribute(col,3));
const sea=new T.Mesh(og,new T.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:.35,metalness:.1}));sea.frustumCulled=false;sc.add(sea);

// Ondas de Gerstner (direção, comprimento, fator de amplitude)
const WV=[[0,38,1],[.85,24,.6],[-1.05,15,.35],[1.95,9,.2]].map(([a,L,f])=>({a,dx:0,dz:1,k:6.2832/L,f,o:0}));
const setWaveDir=a=>{for(const w of WV){w.dx=Math.sin(a+w.a);w.dz=Math.cos(a+w.a)}};setWaveDir(.45);
let amp=.1,st=.2,chop=.04,wt=0,px=0,pz=0;
function H(x,z){let y=chop*Math.sin(x*.8+wt*1.9)*Math.cos(z*.7-wt*1.5);for(const w of WV)y+=amp*w.f*Math.sin(w.k*(w.dx*x+w.dz*z)-Math.sqrt(9.8*w.k)*wt);return y}
function updSea(s){
 for(const w of WV)w.o=Math.sqrt(9.8*w.k)*wt;
 for(let i=0,n=0;i<NV;i++){
  const x=bx[i]+px,z=bz[i]+pz;let y=chop*Math.sin(x*.8+wt*1.9)*Math.cos(z*.7-wt*1.5),ox=0,oz=0;
  for(const w of WV){const p=w.k*(w.dx*x+w.dz*z)-w.o,A=amp*w.f;y+=A*Math.sin(p);const k=st*A*Math.cos(p);ox+=k*w.dx;oz+=k*w.dz}
  P[n++]=bx[i]+ox;P[n++]=Math.round(y/.35)*.35;P[n++]=bz[i]+oz}
 for(let f=0;f<ix.length;f++){const v=ix[f]*3,o=f*3;pos[o]=P[v];pos[o+1]=P[v+1];pos[o+2]=P[v+2]}
 c3(DEEP,s,cD);c3(SHAL,s,cS);
 const th=.8-.2*s,fa=.15+.85*Math.min(1,s*1.6),hs=1/(amp*2.2+chop+.01),ct=.5*(.45+.55*s);
 for(let f=0;f<ix.length;f+=3){
  const o=f*3,y=(pos[o+1]+pos[o+4]+pos[o+7])/3,n=clamp(.5+ct*y*hs,0,1);
  q.copy(cD).lerp(cS,n);if(n>th)q.lerp(FOAM,(n-th)/(1-th)*fa);q.multiplyScalar(jit[f/3]);
  for(let k=0;k<9;k+=3){col[o+k]=q.r;col[o+k+1]=q.g;col[o+k+2]=q.b}}
 og.attributes.position.needsUpdate=true;og.attributes.color.needsUpdate=true}

/* ===== Arquipélago: gerador de ilhas (do projeto Arquipélago Lowpoly Infinito), isolado em escopo próprio ===== */
const ilhasRoot=new T.Group();sc.add(ilhasRoot);
const ILHAS=(function(scene){
const T=THREE,PI=Math.PI;
let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const R=(a,b)=>a+(b-a)*rnd(),P=a=>a[rnd()*a.length|0];
const col=c=>new T.Color(c).offsetHSL(R(-.012,.012),R(-.05,.05),R(-.035,.035));
const mat=c=>new T.MeshLambertMaterial({color:col(c),vertexColors:true});
const grad=g=>{g.computeBoundingBox();const b=g.boundingBox,p=g.attributes.position,n=p.count,a=new Float32Array(n*3),h=(b.max.y-b.min.y)||1;for(let i=0;i<n;i++){const v=.8+.28*(p.getY(i)-b.min.y)/h;a.set([v,v,v],i*3)}g.setAttribute('color',new T.BufferAttribute(a,3));return g};
const mesh=(g,c,x=0,y=0,z=0)=>{const m=new T.Mesh(grad(g),Array.isArray(c)?c.map(mat):mat(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;return m};
const jit=(g,a)=>{const p=g.attributes.position,k={};for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),h=[x,y,z].map(v=>v.toFixed(3)).join(),o=k[h]||(k[h]=[R(-a,a),R(-a,a),R(-a,a)]);p.setXYZ(i,x+o[0],y+o[1],z+o[2])}return g};
const ico=(r,d=1,j=.1)=>jit(new T.IcosahedronGeometry(r,d),r*j);
const cyl=(a,b,h,n=6)=>new T.CylinderGeometry(a,b,h,n);
const cone=(r,h,n=5)=>new T.ConeGeometry(r,h,n);
const grp=(...m)=>{const g=new T.Group();g.add(...m);return g};
const GL=[0x6fbf5a,0x7ccb62,0x5aa84f];
const tuft=(x,z,s=1)=>{if(window.NT)return new T.Group();const g=grp(...[0,1,2].map(i=>{const m=mesh(cone(.05*s,R(.2,.34)*s,4),P(GL),Math.cos(i*2.1)*.06*s,.13*s,Math.sin(i*2.1)*.06*s);m.rotation.set(R(-.3,.3),0,R(-.3,.3));m.castShadow=false;return m}));g.position.set(x,0,z);return g};
const root=(r,c,a)=>{const m=mesh(cone(r*.3,.45,4),c,Math.cos(a)*r*1.05,.1,Math.sin(a)*r*1.05);m.rotation.set(Math.sin(a)*1.15,0,-Math.cos(a)*1.15);return m};

/* Árvores */
const trunk=(h,r=.18,c=0x7a5239)=>grp(mesh(cyl(r*.7,r,h,7),c,0,h/2,0),mesh(cyl(r*1.02,r*1.1,.9,7),c,0,-.4,0),...[0,1,2,3].map(i=>root(r,c,i*1.6+R(0,.5))));
const pine=()=>{const n=4+(rnd()*3|0),w=R(1,1.35),c=P([0x2f7d4f,0x3a8f5a,0x27684a]),g=grp(trunk(.9,.2));for(let i=0;i<n;i++){const t=i/(n-1),m=mesh(jit(new T.ConeGeometry(w*(1-t*.62),1.05-t*.2,8),.04),c,0,.85+i*.62,0);m.rotation.y=i*.5;g.add(m)}return g};
const tree=(cs,tr=0x7a5239,k=1)=>{const h=R(1.3,2)*k,g=grp(trunk(h,R(.17,.25),tr)),c=P(cs),c2=P(cs),b=mesh(ico(R(1,1.25),1,.08),c,0,h+.65,0);b.scale.y=.9;g.add(b);for(let i=0;i<6;i++){const a=i*1.05+R(0,.5);g.add(mesh(ico(R(.5,.72),1,.08),i%2?c:c2,Math.cos(a)*.85,h+.35+R(0,.7),Math.sin(a)*.85))}g.add(mesh(ico(R(.45,.6),1,.08),c2,R(-.2,.2),h+1.5,R(-.2,.2)),tuft(1,.6,1.2),tuft(-.9,-.7,1));return g};
const round=()=>tree([0x6cbf5a,0x5aae4f,0x82c95e]);
const blossom=()=>tree([0xf4a6c0,0xf7b9cf,0xe98fb0],0x6b4a3a,.85);
const autumn=()=>tree([0xe8893a,0xf0a93a,0xd4642c],0x6b4a3a);

/* Arbustos */
const GB=[0x4f9d4a,0x5cb35a,0x3f8a4a];
const bush=(c,n=5)=>{const g=new T.Group(),bl=[];for(let i=0;i<n;i++){const a=i/n*6.28+R(0,.6),d=i?R(.35,.55):0,r=i?R(.4,.55):R(.6,.7),p=[Math.cos(a)*d,r*.75+(i?0:.1),Math.sin(a)*d];bl.push([p,r]);g.add(mesh(ico(r,1,.07),c,...p))}g.add(tuft(.75,.3,1.1),tuft(-.65,-.5,1));g.userData.bl=bl;return g};
const dots=(g,c,n,s)=>{for(let i=0;i<n;i++){const [p,r]=P(g.userData.bl),a=R(0,6.28),b=R(.2,1.3);g.add(mesh(ico(s,0,0),P(c),p[0]+Math.sin(b)*Math.cos(a)*r*.98,p[1]+Math.cos(b)*r*.98,p[2]+Math.sin(b)*Math.sin(a)*r*.98))}return g};
const bushA=()=>bush(P(GB));
const berry=()=>dots(bush(P(GB)),[0xd7263d],12,.075);
const bloomB=()=>dots(bush(P(GB)),[0xffb3c6,0xffffff,0xffd166],14,.1);
const hedge=()=>{const g=new T.Group(),c=P(GB),n=4+(rnd()*2|0);for(let i=0;i<n;i++){const r=R(.45,.52),m=mesh(ico(r,1,.07),c,(i-(n-1)/2)*.5,r*.9,R(-.08,.08));m.scale.set(1,1.15,1.1);g.add(m)}for(let i=0;i<n-1;i++)g.add(mesh(ico(.38,1,.07),c,(i-(n-2)/2)*.5,.85,0));g.add(tuft(.9,.4,1.1),tuft(-.9,-.3,1));return g};

/* Troncos */
const BK=[0x7a5239,0x8a5e3c,0x6b4a3a],CUT=0xe8c48f,RING=0xc99a63;
const logG=(r,l,y=r*.95)=>{const g=grp(mesh(cyl(r,r,l,9).rotateZ(PI/2),[P(BK),CUT,CUT],0,y,0));[-1,1].forEach(s=>g.add(mesh(cyl(r*.55,r*.55,.03,8).rotateZ(PI/2),RING,s*l/2,y,0)));return g};
const logA=(r=R(.27,.36))=>{const g=logG(r,R(1.8,2.5)),s=mesh(cyl(.04,.06,.4,5),0x7a5239,R(-.3,.3),r*1.7,r*.5);s.rotation.set(.7,0,R(-.4,.4));g.add(s,tuft(.5,.4,1),tuft(-.7,-.35,.9));return g};
const mush=(x,y,z,s=1)=>{const g=grp(mesh(cyl(.04,.05,.12,5),0xf5ead8,0,.06,0),mesh(new T.SphereGeometry(.1,6,4,0,6.28,0,1.6),P([0xe5484d,0xf08a4b]),0,.12,0));g.position.set(x,y,z);g.scale.setScalar(s);return g};
const stump=()=>{const r=R(.38,.5),h=R(.4,.65),g=grp(mesh(cyl(r*.88,r*1.08,h,9),[P(BK),CUT,CUT],0,h/2,0),mesh(cyl(r*1.08,r*1.1,.6,9),0x7a5239,0,-.28,0),mesh(cyl(r*.6,r*.6,.03,9),RING,0,h+.012,0),mesh(cyl(r*.28,r*.28,.03,7),0xb88450,0,h+.02,0));for(let i=0;i<4;i++)g.add(root(r*1.1,0x7a5239,i*1.6+R(0,.5)));g.add(mush(r*1.35,0,R(-.3,.3),R(.9,1.3)),tuft(-r*1.3,.2,1));return g};
