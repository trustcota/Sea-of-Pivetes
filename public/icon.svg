<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Brutalist dark background -->
  <rect width="512" height="512" rx="128" fill="#111111" stroke="#FFD400" stroke-width="12" />
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00D9FF" stroke-width="8" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFD400" stroke-width="16" />
  <circle cx="256" cy="256" r="90" fill="none" stroke="#00D9FF" stroke-width="10" />

  <!-- Steering Wheel Spokes (Brutalist thick lines) -->
  <!-- Vertical -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#FFD400" stroke-width="24" stroke-linecap="round" />
  <!-- Horizontal -->
  <line x1="40" y1="256" x2="472" y2="256" stroke="#FFD400" stroke-width="24" stroke-linecap="round" />
  <!-- Diagonal 1 -->
  <line x1="103" y1="103" x2="409" y2="409" stroke="#FFD400" stroke-width="20" stroke-linecap="round" />
  <!-- Diagonal 2 -->
  <line x1="103" y1="409" x2="409" y2="103" stroke="#FFD400" stroke-width="20" stroke-linecap="round" />

  <!-- Outer handles/pegs -->
  <!-- Top/Bottom -->
  <circle cx="256" cy="30" r="18" fill="#00D9FF" stroke="#111111" stroke-width="4" />
  <circle cx="256" cy="482" r="18" fill="#00D9FF" stroke="#111111" stroke-width="4" />
  <!-- Left/Right -->
  <circle cx="30" cy="256" r="18" fill="#00D9FF" stroke="#111111" stroke-width="4" />
  <circle cx="482" cy="256" r="18" fill="#00D9FF" stroke="#111111" stroke-width="4" />

  <!-- Wheel Center Hub -->
  <circle cx="256" cy="256" r="50" fill="#111111" stroke="#FFD400" stroke-width="12" />
  <circle cx="256" cy="256" r="20" fill="#00D9FF" />
</svg>
